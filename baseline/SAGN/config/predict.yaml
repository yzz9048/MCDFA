model:
  target: Models.interpretable_diffusion.gaussian_diffusion.Diffusion_TS
  params:
    seq_length: 30 # 同时要改后面的window
    DeltaT: 10 # 同args.pred_len
    feature_size: 3 # rps + 微服务数量 + label
    n_layer_enc: 3
    n_layer_dec: 2
    d_model: 64  # 4 X 16
    timesteps: 500
    sampling_timesteps: 500
    loss_type: 'l1'
    beta_schedule: 'cosine'
    n_heads: 4
    mlp_hidden_times: 4
    attn_pd: 0.0
    resid_pd: 0.0
    kernel_size: 1
    padding_size: 0

solver:
  base_lr: 1.0e-5
  max_epochs: 10000
  results_folder: ./Checkpoints_GAIA
  gradient_accumulate_every: 2
  save_cycle: 1800  # max_epochs // 10
  ema:
    decay: 0.995
    update_interval: 10
  
  scheduler:
    target: engine.lr_sch.ReduceLROnPlateauWithWarmup
    params:
      factor: 0.5
      patience: 4000
      min_lr: 1.0e-5
      threshold: 1.0e-1
      threshold_mode: rel
      warmup_lr: 8.0e-4
      warmup: 500 
      verbose: False

dataloader:
  target: Utils.Data_utils.real_datasets.CustomDataset
  params:
    name: GAIA
    proportion: 0.6  # rate
    data_root: ./Data/GAIA.csv #还要修改solver.results_folder
    window: 30  # seq_length
    DeltaT: 10
    save2npy: True
    neg_one_to_one: True
    seed: 123
    style: separate
    distribution: geometric
  coefficient: 1.0e-2
  step_size: 5.0e-2
  sampling_steps: 500

  batch_size: 64
  shuffle: False # 需要历史窗口数据做预测