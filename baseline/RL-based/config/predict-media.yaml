model:
  target: Models.interpretable_diffusion.gaussian_diffusion.Diffusion_TS
  params:
    seq_length: 30 # 同时要改后面的window
    DeltaT: 10 # 同args.pred_len
    feature_size: 34 # rps + 微服务数量 + label
    n_layer_enc: 3
    n_layer_dec: 2
    d_model: 64  # 4 X 16
    timesteps: 500
    sampling_timesteps: 500
    loss_type: 'l1'
    beta_schedule: 'cosine'
    n_heads: 4
    mlp_hidden_times: 4
    attn_pd: 0.0
    resid_pd: 0.0
    kernel_size: 1
    padding_size: 0
    clip_denoised: False
    forecast_safety_multiplier: 2.0
    adaptation_regularization: 1.0e-3
    drift_adaptation:
      enabled: True
      enable_adapter: True
      use_memory: True
      use_load_gate: True
      concept_dim: 64
      bottleneck_dim: 32
      fast_rate: 0.2
      slow_rate: 0.02
      memory_warmup: 16
      confirmation_windows: 8
      residual_ratio_limit: 3.0
      max_scale: 0.15
      max_shift: 0.1

solver:
  base_lr: 1.0e-5
  max_epochs: 18000
  results_folder: ./Checkpoints_media_drift_v1_622
  gradient_accumulate_every: 2
  save_cycle: 1800  # max_epochs // 10
  ema:
    decay: 0.995
    update_interval: 10
  
  scheduler:
    target: engine.lr_sch.ReduceLROnPlateauWithWarmup
    params:
      factor: 0.5
      patience: 4000
      min_lr: 1.0e-5
      threshold: 1.0e-1
      threshold_mode: rel
      warmup_lr: 8.0e-4
      warmup: 500 
      verbose: False

dataloader:
  target: Utils.Data_utils.real_datasets.CustomDataset
  params:
    name: media
    proportion: 0.6  # chronological train targets
    validation_proportion: 0.2  # next 20%; final 20% is test
    data_root: ./Data/media.csv #还要修改solver.results_folder
    window: 30  # seq_length
    DeltaT: 1  # sliding-window stride; model DeltaT remains the horizon
    save2npy: True
    neg_one_to_one: True
    feature_scaling: train_minmax
    seed: 123
    style: separate
    distribution: geometric
  coefficient: 1.0e-2
  step_size: 5.0e-2
  sampling_steps: 500
  decision_threshold: 0.5
  select_threshold_on_validation: True
  threshold_selection_objective: hits_lead
  online_granger_update: False
  drift_warmup_windows: 128
  prediction_batch_size: 64
  min_validation_event_recall: 0.0
  min_validation_event_lead_time: 0.0

  batch_size: 64
  shuffle: False # 需要历史窗口数据做预测
